{% extends "base.html" %}

{% block title %}{{ error_title }} — Scuole di Psicoterapia Cognitiva (AIP){% endblock %}

{% block content %}
<main class="w-full max-w-lg mx-auto px-4 py-16 flex flex-col items-center text-center">

    <article class="w-full bg-white rounded-2xl p-8 sm:p-10 border border-slate-200 card-elevation">
        
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-amber-50 text-amber-700 mb-6" aria-hidden="true">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-[#0F172A] mb-3">{{ error_title }}</h1>
        
        <p class="text-slate-600 text-sm leading-relaxed mb-8">
            {{ error_message }}
        </p>

        <a 
            href="/" 
            class="inline-flex items-center justify-center px-6 py-3 rounded-xl text-sm font-semibold text-white bg-[#0F172A] hover:bg-[#1E293B] btn-transition shadow-sm"
        >
            Torna alla Home
        </a>

    </article>

</main>
{% endblock %}

[project]
name = "aip"
version = "0.1.0"
description = "Scuole di Psicoterapia Cognitiva — Artificial Intelligence Platform (AIP)"
authors = [{ name = "SPC / APC" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "cryptography>=43.0.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "google-generativeai>=0.8.0",
    "openai>=1.50.0",
    "anthropic>=0.36.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pypdf>=5.0.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*Suite", "*TestClass"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
